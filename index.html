<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>my website</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  /* Step 1: intro screen */
  #intro {
    padding-top: 20px;
  }
  #intro h1 { font-size: 2em; margin: 0.67em 0; }
  #intro h2 { font-size: 1.5em; margin: 0.83em 0; }
  #intro h3 { font-size: 1.17em; margin: 1em 0; }

  #gate {
    width: 220px;
    max-width: 60%;
    margin-top: 20px;
    cursor: pointer;
    animation: bob 1s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  /* Step 2: full-screen background, hidden until revealed */
  #bg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: fill; /* use cover to avoid distortion */
    transform-origin: center;
    animation: stretch 1s ease-in-out infinite;
  }

  @keyframes stretch {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(1.15); }
  }
</style>
</head>
<body>

<div id="intro">
  <h1>Siemano kolano!</h1>
  <h2>We no walnij 3 razy w spacje.</h2>
  <h3>(albo kliknij w kukirina)</h3>
  <img id="gate" src="image2.png" alt="">
</div>

<img id="bg" src="image.jpg" alt="">
<audio id="song" src="song.mp3" loop></audio>

<script>
  var intro = document.getElementById("intro");
  var bg = document.getElementById("bg");
  var song = document.getElementById("song");
  var revealed = false;
  var spaceCount = 0;

  function reveal() {
    if (revealed) return;
    revealed = true;
    song.play(); // allowed, because it's triggered by a click / key press
    intro.style.display = "none";
    bg.style.display = "block";
  }

  document.getElementById("gate").addEventListener("click", reveal);

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      spaceCount++;
      if (spaceCount >= 3) reveal();
    }
  });
</script>
</body>
</html>
